<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nexora — gerenciador de tarefas full-stack.">
  <title>Nexora | Jonas Sousa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>

  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="brand">Nexora</div>
      <p class="eyebrow">FULL-STACK PROJECT</p>
      <h1>Organize seu trabalho.</h1>
      <p class="muted">Gerencie tarefas, prioridades e prazos em um único lugar.</p>

      <div class="tabs">
        <button class="tab active" data-auth-tab="login">Entrar</button>
        <button class="tab" data-auth-tab="register">Criar conta</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>E-mail<input id="login-email" type="email" required autocomplete="email"></label>
        <label>Senha<input id="login-password" type="password" required autocomplete="current-password"></label>
        <button class="primary-btn" type="submit">Entrar</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Nome<input id="register-name" type="text" required autocomplete="name"></label>
        <label>E-mail<input id="register-email" type="email" required autocomplete="email"></label>
        <label>Senha<input id="register-password" type="password" minlength="6" required autocomplete="new-password"></label>
        <button class="primary-btn" type="submit">Criar minha conta</button>
      </form>
    </div>
  </section>

  <section id="app-screen" class="app-screen hidden">
    <header class="topbar">
      <div class="brand">Nexora</div>
      <div class="user-area">
        <span id="user-name"></span>
        <button id="logout-btn" class="ghost-btn">Sair</button>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <div>
          <p class="eyebrow">SEU PAINEL</p>
          <h2>Olá, <span id="hero-name"></span> 👋</h2>
          <p class="muted">Acompanhe suas tarefas e mantenha o foco no que importa.</p>
        </div>
        <button id="new-task-btn" class="primary-btn">+ Nova tarefa</button>
      </section>

      <section class="stats">
        <article class="stat-card"><span>Total</span><strong id="stat-total">0</strong></article>
        <article class="stat-card"><span>Pendentes</span><strong id="stat-pending">0</strong></article>
        <article class="stat-card"><span>Concluídas</span><strong id="stat-done">0</strong></article>
        <article class="stat-card"><span>Alta prioridade</span><strong id="stat-high">0</strong></article>
      </section>

      <section class="toolbar">
        <input id="search-input" type="search" placeholder="Pesquisar tarefas...">
        <select id="filter-select">
          <option value="all">Todas</option>
          <option value="pending">Pendentes</option>
          <option value="done">Concluídas</option>
          <option value="high">Alta prioridade</option>
        </select>
      </section>

      <section id="task-list" class="task-list"></section>
      <p id="empty-state" class="empty hidden">Nenhuma tarefa encontrada.</p>
    </main>
  </section>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog" class="task-form">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">NEXORA</p>
          <h3 id="dialog-title">Nova tarefa</h3>
        </div>
        <button type="button" id="close-dialog" class="icon-btn">×</button>
      </div>

      <input id="task-id" type="hidden">

      <label>Título<input id="task-title" type="text" maxlength="160" required></label>
      <label>Descrição<textarea id="task-description" rows="4" placeholder="Descreva a tarefa..."></textarea></label>

      <div class="form-grid">
        <label>Prioridade
          <select id="task-priority">
            <option value="low">Baixa</option>
            <option value="medium" selected>Média</option>
            <option value="high">Alta</option>
          </select>
        </label>

        <label>Prazo<input id="task-due-date" type="date"></label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="cancel-dialog" class="ghost-btn">Cancelar</button>
        <button type="submit" class="primary-btn">Salvar tarefa</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
